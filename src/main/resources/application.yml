spring:
  application:
    name: billing-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/billing}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

oficina:
  jwt:
    secret: ${OFICINA_JWT_SECRET:minha-chave-secreta-super-segura-para-jwt-hs256}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-token-aqui}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8082/api/billing/pagamentos/webhook}
