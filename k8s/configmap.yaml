apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: oficina
data:
  SPRING_DATA_MONGODB_URI: "mongodb://billing_service:billing_service@billing-db:27017/billing?authSource=admin"
  SPRING_PROFILES_ACTIVE: "prod"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "guest"
  MERCADOPAGO_WEBHOOK_URL: "https://seu-dominio.com/api/billing/pagamentos/webhook"
  NEW_RELIC_AGENT_ENABLED: "false"
